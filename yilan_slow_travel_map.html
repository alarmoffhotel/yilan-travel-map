function makeIcon(p){return L.divIcon({className:'',html:`<div class="marker" style="background:${colors[p.category]||'#666'}"><span>${icons[p.category]||'•'}</span></div>`,iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-26]})}
function filtered(){return points.filter(p=>(active==='全部'||p.category===active)&&((p.name+p.category).toLowerCase().includes(query.toLowerCase())));}
function renderChips(){document.getElementById('chips').innerHTML=['全部',...categories].map(c=>`<button class="chip ${c===active?'active':''}" onclick="active='${c}';render()">${c==='全部'?'全部':(icons[c]+' '+c)}</button>`).join('')}
function renderLegend(){document.getElementById('legend').innerHTML=categories.map(c=>`<div class="legend-item"><span class="dot" style="background:${colors[c]}"></span>${icons[c]} ${c}</div>`).join('')}
function render(){renderChips();renderLegend();layer.clearLayers();markerByName.clear();const fs=filtered();document.getElementById('count').textContent=`共 ${fs.length} 個地點`;document.getElementById('list').innerHTML=fs.map((p,i)=>`<div class="place" onclick="focusPlace(${i})"><b>${p.name}</b><span>${icons[p.category]} ${p.category}</span></div>`).join('');fs.forEach((p,i)=>{const m=L.marker([p.lat,p.lng],{icon:makeIcon(p)}).bindPopup(`<div class="popup"><h3>${p.name}</h3><p>${icons[p.category]} ${p.category}</p></div>`);m.addTo(layer);markerByName.set(i,m);}); if(fs.length){const bounds=L.latLngBounds(fs.map(p=>[p.lat,p.lng]));map.fitBounds(bounds.pad(0.12));}}
function focusPlace(i){const fs=filtered();const p=fs[i];map.setView([p.lat,p.lng],14);markerByName.get(i).openPopup();}
document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render();});
render();
</script>
</body></html>
